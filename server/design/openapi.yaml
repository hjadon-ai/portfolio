openapi: 3.0.3

info:
  title: Astitva API
  version: 0.2.0
  description: Local REST API for the Astitva portfolio.

servers:
  - url: http://localhost:3001
    description: Local Express server

tags:
  - name: System
  - name: Authentication

paths:
  /api/health:
    get:
      tags: [System]
      summary: Check server health
      operationId: getHealth
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/auth/signup:
    post:
      tags: [Authentication]
      summary: Create a local account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with the email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and create a session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded. The response sets an HTTP-only session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the logged-in user
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out and delete the current session
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logout completed.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: astitva_session

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed or is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: Astitva server is running

    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 80
          example: Astitva User
        email:
          type: string
          format: email
          maxLength: 254
          example: developer@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: local-demo-password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: developer@example.com
        password:
          type: string
          format: password
          example: local-demo-password

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
